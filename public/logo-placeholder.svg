<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 72" fill="none">
  <!-- Black left half -->
  <rect width="110" height="72" rx="6" ry="6" fill="#0A0A0A"/>
  <!-- Red right half with diagonal cut -->
  <clipPath id="right-clip">
    <polygon points="110,0 220,0 220,72 110,72"/>
  </clipPath>
  <rect width="220" height="72" rx="6" ry="6" fill="#EB0A1E" clip-path="url(#right-clip)"/>
  <!-- Diagonal divider -->
  <line x1="95" y1="0" x2="125" y2="72" stroke="#0A0A0A" stroke-width="2"/>
  <!-- GR text -->
  <text x="55" y="30" font-family="Arial Black, Arial" font-size="20" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">GR</text>
  <!-- GAZOO RACING -->
  <text x="55" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1.5">GAZOO RACING</text>
  <!-- URUGUAY -->
  <text x="165" y="40" font-family="Arial Black, Arial" font-size="11" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">URUGUAY</text>
</svg>
